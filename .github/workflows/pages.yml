name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm --version
      - run: pnpm install --no-frozen-lockfile
      - name: Build web (demo mode, sub-path)
        env:
          VITE_BASE: /kennote-demo/
          VITE_DEMO: '1'
          VITE_API_BASE_URL: ''
          VITE_WS_URL: ''
        run: pnpm --filter @kennote/web build
      - name: SPA fallback for GitHub Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html && touch apps/web/dist/.nojekyll
      # Pages 來源設為「Deploy from a branch → gh-pages」：把建置產物推到該分支，
      # 由 GitHub 內建的 pages-build-deployment 發佈（不需要 github-pages 環境規則）。
      - name: Publish to gh-pages branch
        run: |
          cd apps/web/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "demo build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
