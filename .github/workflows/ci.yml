name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  check:
    name: typecheck / lint / test / deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm --version
      - run: pnpm install --no-frozen-lockfile

      # ⭐ 自研紀律檢查：黑名單 + editor-core 零依賴 + web 依賴數量上限
      - name: deps:check
        run: pnpm deps:check

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      # 沒有 DATABASE_URL_TEST 時，需要資料庫的測試會自動 skip
      - name: unit tests
        run: pnpm test

  integration:
    name: integration (with postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kennote
          POSTGRES_PASSWORD: kennote
          POSTGRES_DB: kennote_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kennote -d kennote_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kennote:kennote@localhost:5432/kennote_test
      DATABASE_URL_TEST: postgres://kennote:kennote@localhost:5432/kennote_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm --version
      - run: pnpm install --no-frozen-lockfile
      - name: migrate
        run: pnpm db:migrate
      - name: integration tests
        run: pnpm --filter @kennote/server test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm --version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

  security:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm --version
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit --audit-level=high
