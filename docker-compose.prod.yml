# ============================================================
# 正式環境：docker compose -f docker-compose.prod.yml up -d --build
#
#   對外只開一個埠：http://<主機>:8090
#   postgres 與 server 都不對外開埠，只在 compose 網路內互通。
#   server 啟動前會自動跑 migration（冪等）。
#
# 事前準備：
#   cp .env.example .env
#   # 至少要改：JWT_SECRET（openssl rand -base64 48）、POSTGRES_PASSWORD
#   # 若走 HTTPS，記得把 COOKIE_SECURE 設為 true
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: kennote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kennote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kennote}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kennote} -d ${POSTGRES_DB:-kennote}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kennote]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: prod
    container_name: kennote-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-kennote}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kennote}
      JWT_SECRET: ${JWT_SECRET:?please set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8090}
      # 同源部署（nginx 反向代理），不需要 CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/data/uploads
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-52428800}
      FEATURE_REALTIME: ${FEATURE_REALTIME:-true}
      FEATURE_OT: ${FEATURE_OT:-false}
      FEATURE_OPEN_LOGIN: ${FEATURE_OPEN_LOGIN:-true}
      FEATURE_PUBLIC_SHARE: ${FEATURE_PUBLIC_SHARE:-false}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [kennote]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    container_name: kennote-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8090}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [kennote]

volumes:
  pgdata:
  uploads:

networks:
  kennote:
    driver: bridge
